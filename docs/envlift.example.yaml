# envlift 配置示例（schema v2）
#
# 本文件全部是假数据：用户名、主机名、盘符用途、软件名均为虚构，可安全提交入库。
# 用途有两个：① schema 参考；② 测试用的 golden file。
#
# 生成自己的真实配置请运行：envlift scan
# 注意：envlift.yaml 默认被 .gitignore 忽略（含已装软件清单等可推断单位/行业的信息）。
#      --raw 导出的文件请务必用 *.raw.yaml 命名，该模式同样被忽略。

app: envlift
schema: 2
generated_at: '2026-01-01T00:00:00+08:00'

source_machine:
  # version 按 build 号判定；product_name 是注册表原值，仅作参考（实测并不可靠）
  os:
    version: 'Windows 11'
    build: '26100'
    product_name: 'Windows 11 Pro'
    display_version: '24H2'
  arch: amd64
  hostname: '${HOST}'
  username: '${USER}'

# 仅作还原判断的元信息，不承担脱敏职责（D5-R1）。
# purpose 由人手工填写，scan 不会猜。
drive_map:
  C:
    label: 'System'
    purpose: ''
  D:
    label: 'Data'
    purpose: ''

# 保留注册表原始字面值，不展开 %VAR%（B1）。
# expand: true 表示来源类型为 REG_EXPAND_SZ。
path:
  user:
    - value: 'C:\Users\${USER}\AppData\Local\Microsoft\WindowsApps'
    - value: '%USERPROFILE%\bin'
      expand: true
  machine:
    - value: 'C:\Windows\system32'
    - value: '%SystemRoot%\System32\Wbem'
      expand: true
    - value: 'C:\Program Files\Git\cmd'

runtimes:
  - name: python
    command: python
    version: '3.13.12'
    manager: conda
    executable: 'C:\Users\${USER}\miniconda3\python.exe'
    # 可执行文件来自哪个 PATH 段、段内第几条，回答「为什么解析到这个」
    resolved_from: user
    resolved_index: 0
  - name: node
    command: node
    version: '22.22.2'
    manager: fnm
    executable: 'C:\Users\${USER}\AppData\Roaming\fnm\node-versions\v22.22.2\installation\node.exe'
  - name: java
    command: java
    version: null
    manager: null
    executable: null

software:
  - name: 'Example Editor'
    version: '1.90.0'
    install_location: 'C:\Program Files\Example Editor'
    winget_id: 'Example.Editor'
    sources: [registry, winget]
    silent_capable: true
    manual_hint: null
  - name: 'Example CAD Suite'
    version: '30.8.2'
    install_location: 'D:\Program Files\Example CAD Suite'
    winget_id: null
    sources: [registry]
    silent_capable: false
    manual_hint: '需厂商账号登录后安装'

# conda 环境快照。base 默认只读；命名环境可按需恢复 conda 包与 pip 包。
conda_envs:
  - name: py311
    prefix: 'C:\Users\${USER}\miniconda3\envs\py311'
    manager: 'C:\Users\${USER}\miniconda3'
    conda_exe: 'C:\Users\${USER}\miniconda3\Scripts\conda.exe'
    conda_version: '26.9.3'
    python_version: '3.11.9'
    restore_conda: true
    restore_pip: true
    mirror: example-corp
    packages:
      - name: numpy
        version: '1.26.4'
        build: py311_0
        channel: conda-forge
      - name: python
        version: '3.11.9'
        build: h1
        channel: conda-forge
    pip_packages:
      - name: requests
        version: '2.31.0'
  - name: base
    prefix: 'C:\Users\${USER}\miniconda3'
    manager: 'C:\Users\${USER}\miniconda3'
    conda_exe: 'C:\Users\${USER}\miniconda3\Scripts\conda.exe'
    conda_version: '26.9.3'
    python_version: '3.12.1'
    base: true
    restore_conda: false
    restore_pip: false
    packages:
      - name: python
        version: '3.12.1'
        build: h1
        channel: conda-forge

# 命名镜像 profile；envlift 不硬编码公共镜像。
mirrors:
  example-corp:
    conda_channels:
      - conda-forge
    pip_index_url: 'https://pypi.example.invalid/simple'
    pip_extra_index_url:
      - 'https://mirror.example.invalid/simple'
    pip_trusted_host:
      - mirror.example.invalid

installers:
  - name: example-editor
    winget_ids: ['Example.Editor']
    aliases: ['Example Editor']
    match_display: '(?i)^Example Editor'
    match: 'ExampleEditorSetup-*.exe'
    silent_args: '/VERYSILENT /NORESTART'
    # 示例：声明后可在 GUI/决策文件里用 set_location 指定安装目录。
    install_dir_arg: '/DIR="{install_dir}"'
    winget_location_arg: '--location "{install_dir}"'
    install_dir_source: 'Inno Setup /DIR 官方参数；winget --location 本机 install --help 实测'
    needs_admin: true
    order: 10
    verify:
      command: 'example-editor --version'
      expect_contains: 'Example Editor'
    expect_reboot: false
    source: builtin
    verified_at: '2026-01-15'
