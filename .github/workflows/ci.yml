name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: go build
        run: go build -trimpath -ldflags "-s -w" -o envlift.exe ./cmd/envlift

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: node check
        run: node --check internal/webui/static/app.js

      - name: gofmt check
        shell: pwsh
        run: |
          $unformatted = gofmt -l .
          if ($unformatted) {
            $unformatted
            exit 1
          }
