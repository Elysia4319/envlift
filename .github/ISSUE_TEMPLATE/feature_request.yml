name: Feature request
description: Suggest a focused improvement for envlift
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you try or consider?
    validations:
      required: false
  - type: textarea
    id: safety
    attributes:
      label: Safety impact
      description: Does this change installation, PATH, elevation, or data handling?
    validations:
      required: false
